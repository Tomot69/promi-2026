    p.innerHTML='<span class="k"></span><span class="v ac"></span>'; p.querySelector('.k').textContent=T.e2.toutAfficher; p.querySelector('.v').textContent=T.e2.toutAfficherValeur; c.parentNode.insertBefore(p, c);
    var G=null, tF=0; function fait(e){ if(e){ try{ e.preventDefault(); e.stopImmediatePropagation(); }catch(_){ } } if(performance.now()-tF<600) return; tF=performance.now(); dvTout(); reglage(); }

  var CLE='promi_e2', etat=null, pid=null, n0=0, F=null, tVu=0, vuOuvert=false, tTenu=0, rejeuE2=false;

  /* ① le principe — bâti dans l'onboarding, à la place du prénom */

      else if(vuOuvert && now-tVu>1500){ fin(false); }                                 /* la fiche refermée sans tenir : le parcours s'arrête, rien n'est redemandé */
      else if(!vuOuvert && now-tVu>12000){ fin(false); }
    } else if(etat==='fin'){ if(!(dp && dp.classList.contains('show')) && now-tTenu>1200){ fin(false); } }
  }
  /* un rechargement au milieu du parcours : il s'arrête là ; sans aucune parole, tout est affiché */
  try{ if(LS.g(CLE) && LS.g('ob_fini')!=='1'){ LS.s('ob_fini','1'); LS.r(CLE); setTimeout(function(){ if(!paroles().length) dvTout(); }, 2500); } }catch(_){ }
  /* le Studio qui n'était pas encore paru à la dernière séance paraît à celle-ci */
  try{ var d0=dvLit(); if(d0 && d0!=='tout' && d0.aura && !d0.studio){ auraNeuve=false; auraVue=true; } }catch(_){ }
  dvPeint(); [300,1200,2500].forEach(function(t){ setTimeout(dvPeint, t); });
  setInterval(veille, 250);
  try{ if(window._paroles && window._paroles.abonne) window._paroles.abonne(function(){ try{ dvVeille(); }catch(_){ } }); }catch(_){ }
  window._e2={principe:principe, plusTard:plusTard, etat:function(){ return {etat:etat, pid:pid, fantome:F, devoile:dvLit()}; }, fin:fin};
  /* l'onboarding est peut-être déjà à l'écran (premier lancement) : sa sortie « Plus tard » se pose tout de suite */
  tard();
})();
</script>
