<script>
window.addEventListener('load',function(){
  var o=document.getElementById('out'), log=function(s){o.innerHTML+=s+'<br>';};
  try{
    log('Toile: '+(window.Toile?'OK':'ABSENT'));
    try{window.Toile_resize&&window.Toile_resize();}catch(e){log('resize ERR '+e);} log('cells avant: '+Toile.cells());
    Toile.sync([1,2,3,4,5,6,7,8,9]);
    log('cells apres: '+Toile.cells());
    setTimeout(function(){
      var m=document.getElementById('minis');
      for(var i=1;i<=6;i++){
        var c=document.createElement('canvas'); c.width=120;c.height=120;
        c.style.cssText='width:60px;height:60px;background:#1f2026';
        m.appendChild(c);
        try{ var r=Toile.dalleTrame(c,i,1); log('dalle '+i+' → '+r); }catch(e){ log('dalle '+i+' ERR '+e); }
      }
    },800);
  }catch(e){ log('ERREUR '+e); }
});
</script>
