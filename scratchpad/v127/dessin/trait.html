<!doctype html><meta charset="utf-8"><title>C-042 · le trait</title>

<script>
fetch('/app.html').then(function(r){return r.text()}).then(function(t){ var st=document.createElement('style'); st.textContent=(t.match(/@font-face\s*\{[^}]*\}/g)||[]).join('\n'); document.head.appendChild(st); return Promise.all([document.fonts.load('700 15px Gilbert'),document.fonts.load('400 13px Atkinson')]); }).then(go, go);
function go(){

document.body.style.background=sombre?'#100D0B':'#F0ECE2'; document.body.style.color=sombre?CREME:ENCRE;
var c=document.getElementById('c');
c.innerHTML='<p class="h">'+V+' · '+(V==='E1'?'effilé court — derniers 10 % du trait':'effilé long — derniers 25 %, début plus marqué')+'</p><p class="s">Trait plein et opaque. Fin 2,5 pt · moyen 4,5 pt · gros 8 pt. La pointe ne descend pas sous 1 pt ; un trait très court reste sans effilé.</p>';
[['fin · 2,5 pt',2.5],['moyen · 4,5 pt',4.5],['gros · 8 pt',8]].forEach(function(T, k){
  var p=document.createElement('p'); p.className='h'; p.style.marginTop='14px'; p.textContent=T[0]; c.appendChild(p);

});
