<style id="lot-V132-DESSIN-css">

  font-family:var(--f-libelle);font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;justify-content:center}

<script id="lot-V132-DESSIN">
/* ⚑ v132 (Tom, 5 oct. 2026, C-042) — LE DESSIN, CONSTRUIT DANS L'APP. « On ne fait plus de planche : on construit, et Tom juge au doigt. »
   LA MISE EN PAGE (elle remplace les planches v130 et v131) : en mode dessin la surface prend toute la place, du haut de l'écran jusqu'à la
   rangée d'outils, posée EN BAS, à portée de pouce ; tailles et couleurs se déploient juste au-dessus d'elle et se replient dès le choix
   fait ; tout le reste de la fiche se retire (le mode est une couche pleine : la fiche dessous n'est pas touchée) ; l'encart du haut ne
   garde que son contour. Le dessin posé est plus grand que la bande : la fiche en montre le HAUT, toucher la bande l'ouvre en entier (C-051).
   LES DONNÉES — un dessin est une liste de TRAITS, jamais une image : {fond, traits:[{c, t, g, pts:[x,y,t,p …]}], poses:[…], pose, masque}.
   · chaque trait garde SA couleur (un hex) : changer de palette ne touche que les traits à venir ;
   · `traits` est le dessin en cours (gardé si l'on sort) ; `poses` est ce que POSER a posé — c'est lui que la bande, la vue entière et le
     partage montrent ;
   · après le premier POSER le fond est fixé, et les nouveaux traits ne prennent que les couleurs déjà présentes dans le dessin ;
   · le masquage est pour soi seul, mémorisé par fiche ; un dessin masqué n'est jamais emporté dans un partage. */
(function(){
  /* ══ LES PARAMÈTRES DE MISE EN PAGE — à régler d'après le retour de Tom (points, écran 390 × 844) ══ */
  var P = window._dessinParams = {
    RANGEE_H: 44,          /* hauteur de la rangée d'outils */
    MARGE_BAS: 34,         /* sous la rangée, jusqu'au bas de l'écran */
    MARGE_HAUT: 12,        /* entre le bas de la surface de dessin et la rangée */
    MARGE_COTE: 24,        /* à gauche et à droite de la rangée */
    PAS_OUTIL: 58,         /* d'un disque d'outil au suivant */
    POSER_L: 104,          /* largeur de POSER */
    ECART_DEPLOI: 8,       /* entre la rangée et ce qui se déploie au-dessus d'elle */
    TAILLES: [2.5, 4.5, 8],          /* fin, moyen, gros — la pointe jamais sous 1 pt */
    TAILLES_GOMME: [10, 18, 30],
    BANDE_RETRAIT: 7,      /* la couche du dessin s'arrête à 7 pt au-dessus de l'axe du trait d'état : le trait reste entier */
    OEIL: {x: 24, ecart: 52}          /* le bouton de masquage : coin bas gauche de la bande, à 52 pt au-dessus du trait */
  };
  var W=390, H=844;
  function surfH(){ return H - P.MARGE_BAS - P.RANGEE_H - P.MARGE_HAUT; }
  var NAT={promi:'#82AEF8', chiche:'#FFB8D2', nuee:'#C9A8F5'};
  var ENCRE='#201908', CREME='#F7F0DE';
  function $(id){ return document.getElementById(id); }
  function dev(){ return $('device'); }
  function clair(){ var d=dev(); return !!(d && d.classList.contains('light')); }
  function hex(c){ if(typeof c==='string') return c.toUpperCase(); return '#'+[c[0],c[1],c[2]].map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?'0':'')+v.toString(16); }).join('').toUpperCase(); }
  function rgb3(s){ var m=String(s||'').match(/[\d.]+/g); if(m && m.length>=3 && String(s).indexOf('#')<0) return [+m[0],+m[1],+m[2]]; var h=String(s||'').replace('#',''); return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0]; }
  function lumi(c){ c=rgb3(c); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
  function palette(){ try{ var m=window.Toile.mondeCourant(); return window.Toile.tonsDe(m.p, m.h).map(hex); }catch(_){ return ['#82AEF8','#FFB8D2','#C9A8F5','#EFE3C7']; } }

  /* ══ LES CIBLES : une parole, le brouillon de la page +, un Cercle ══ */
  var CERCLES=null;
  function cercles(){ if(CERCLES) return CERCLES; try{ CERCLES=JSON.parse(localStorage.getItem('promi_dessins_cercle')||'{}')||{}; }catch(_){ CERCLES={}; } return CERCLES; }
  function garde(c){ try{ if(c && c.type==='cercle') localStorage.setItem('promi_dessins_cercle', JSON.stringify(cercles())); else if(c && c.type==='promi' && typeof saveState==='function') saveState(); }catch(_){ } }
  function lit(c){ if(!c) return null; if(c.type==='promi') return c.p.dessin||null; if(c.type==='brouillon') return (window._phrase||{}).dessin||null; if(c.type==='cercle') return cercles()[c.cle]||null; return null; }
  function ecrit(c, d){ if(!c) return;
    if(c.type==='promi'){ if(d) c.p.dessin=d; else delete c.p.dessin; }
    else if(c.type==='brouillon'){ window._phrase=window._phrase||{}; if(d) window._phrase.dessin=d; else delete window._phrase.dessin; }
    else if(c.type==='cercle'){ if(d) cercles()[c.cle]=d; else delete cercles()[c.cle]; }
    garde(c); }
  function natureDe(c){ try{ if(c.type==='cercle') return 'nuee'; if(c.type==='promi') return c.p.chiche?'chiche':'promi';
      var e=window._ppEcran&&window._ppEcran(); return (e&&e.nat)||'promi'; }catch(_){ return 'promi'; } }
  /* la cible de l'écran affiché */
  function cibleFiche(){ var dp=$('detailPoster'); if(!dp || !dp.classList.contains('show')) return null;
    try{ if(dp.classList.contains('dp-nuee')||dp.classList.contains('dp-mode-nuee')){ return (typeof curNuee!=='undefined' && curNuee) ? {type:'cercle', cle:curNuee, hote:dp} : null; }
      if(typeof cur!=='undefined' && cur) return {type:'promi', p:cur, hote:dp}; }catch(_){ } return null; }
  function ciblePlus(){ var cs=$('createSheet'); if(!cs || !cs.classList.contains('show')) return null; return {type:'brouillon', hote:cs}; }
  function pose_(d){ return !!(d && d.poses && d.poses.length); }
  function visible(c){ var d=lit(c); return pose_(d) && !d.masque; }

  /* ══ LE TRAIT « STYLET » : plein, opaque, contours nets ; effilé E2 (le début plus épais, la fin effilée sur le dernier quart) ;
        plus fin quand le geste est rapide ; la pression d'un stylet module la largeur ; jamais sous 1 pt. ══ */
  function cr(Q, n){ var o=[], L=Q.length; for(var i=0;i<L-1;i++){ var a=Q[Math.max(0,i-1)], b=Q[i], c=Q[i+1], d=Q[Math.min(L-1,i+2)];
      for(var k=0;k<n;k++){ var u=k/n, u2=u*u, u3=u2*u;
        o.push({x:0.5*((2*b.x)+(-a.x+c.x)*u+(2*a.x-5*b.x+4*c.x-d.x)*u2+(-a.x+3*b.x-3*c.x+d.x)*u3),
                y:0.5*((2*b.y)+(-a.y+c.y)*u+(2*a.y-5*b.y+4*c.y-d.y)*u2+(-a.y+3*b.y-3*c.y+d.y)*u3),
                t:b.t+(c.t-b.t)*u, p:b.p+(c.p-b.p)*u}); } } o.push(Q[L-1]); return o; }
  function largeurs(Q, base, effile){ var n=Q.length, s=[0], i; for(i=1;i<n;i++) s.push(s[i-1]+Math.hypot(Q[i].x-Q[i-1].x, Q[i].y-Q[i-1].y)); var L=s[n-1]||1, w=[];
    var court = L < base*3.2, FIN=0.25, DEB=0.20, SUR=0.38;                                    /* E2 */
    for(i=0;i<n;i++){ var a=Math.max(0,i-3), b=Math.min(n-1,i+3), dt=Math.max(1,(Q[b].t-Q[a].t)), vit=(s[b]-s[a])/dt, u=s[i]/L, k=1;
      if(effile && !court){ if(u<DEB){ var q=1-u/DEB; k*=1+SUR*q*q; }
        k*=Math.max(0.72, Math.min(1.06, 1.06-0.42*vit));
        if(u>1-FIN){ k*=Math.pow((1-u)/FIN, 0.85); } }
      k*=(Q[i].p<0 ? 1 : Math.min(1.35, 0.55+0.9*Q[i].p));                                       /* la pression d'un stylet ; un doigt : 1 */
      w.push(Math.max(1, base*k)); }
    return w; }
  function points(tr){ var a=tr.pts, o=[]; for(var i=0;i+3<a.length;i+=4) o.push({x:a[i], y:a[i+1], t:a[i+2], p:a[i+3]}); return o; }
  function traceUn(g, tr, enCours){ var Q=points(tr); if(!Q.length) return;
    g.save(); g.globalAlpha=1; g.globalCompositeOperation = tr.g ? 'destination-out' : 'source-over'; g.fillStyle = tr.g ? '#000000' : tr.c;
    if(Q.length===1){ g.beginPath(); g.arc(Q[0].x, Q[0].y, Math.max(1,tr.t)/2, 0, 6.2832); g.fill(); g.restore(); return; }
    var R=cr(Q, Q.length>240?3:6), Wd=largeurs(R, tr.t, !tr.g && !enCours ? true : !tr.g), n=R.length, G=[], D=[], i;
    for(i=0;i<n;i++){ var a=R[Math.max(0,i-1)], b=R[Math.min(n-1,i+1)], dx=b.x-a.x, dy=b.y-a.y, m=Math.hypot(dx,dy)||1, nx=-dy/m, ny=dx/m, h=Wd[i]/2;
      G.push([R[i].x+nx*h, R[i].y+ny*h]); D.push([R[i].x-nx*h, R[i].y-ny*h]); }
    g.beginPath(); g.moveTo(G[0][0],G[0][1]); for(i=1;i<n;i++) g.lineTo(G[i][0],G[i][1]); for(i=n-1;i>=0;i--) g.lineTo(D[i][0],D[i][1]); g.closePath(); g.fill();
    g.beginPath(); for(i=0;i<n;i++){ g.moveTo(R[i].x+Wd[i]/2, R[i].y); g.arc(R[i].x, R[i].y, Wd[i]/2, 0, 6.2832); } g.fill();     /* ni trou aux virages serrés, ni bout carré */
    g.restore(); }
  /* les traits seuls (sans le fond), dans un canevas à l'échelle k (px par point) */
  function calque(traits, k, hPt){ var cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(W*k)); cv.height=Math.max(1,Math.round(hPt*k));
    var g=cv.getContext('2d'); g.setTransform(k,0,0,k,0,0); (traits||[]).forEach(function(tr){ traceUn(g, tr); }); return cv; }
  /* le dessin POSÉ, entier, avec son fond : pour la bande, la vue entière, le partage */
  var MEMO={};
  function signature(d){ var n=0; (d.poses||[]).forEach(function(t){ n+=t.pts.length; }); return (d.fond||'')+'|'+(d.poses||[]).length+'|'+n+'|'+(d.h||0); }
  function entier(d, k){ var cle=signature(d)+'|'+k; if(MEMO[cle]) return MEMO[cle];
    var hPt=d.h||surfH(), cv=document.createElement('canvas'); cv.width=Math.round(W*k); cv.height=Math.round(hPt*k);
    var g=cv.getContext('2d'); g.fillStyle=d.fond; g.fillRect(0,0,cv.width,cv.height); g.drawImage(calque(d.poses, k, hPt), 0, 0);
    var n=0; for(var q in MEMO){ if(++n>8){ MEMO={}; break; } } MEMO[cle]=cv; return cv; }

  /* ══ LA BANDE : le dessin remplace la dalle ou la photo. Une couche PLEINE (le fond du dessin, puis ses traits, à l'échelle 1, calés en
        haut) posée sur la bande, découpée à 7 pt au-dessus de l'axe du trait d'état : la bande montre UNE chose. Rien n'est relu ni
        retouché dans le canevas de la bande : la retirer rend la dalle. ══ */
  var ICO_OEIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  var ICO_OEIL_NON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 20L20 4"/></svg>';
  function ondeDe(c){ try{ var O=window._onde; if(!O) return null; var b=null, a=null;
      if(c.type==='promi'){ var e=window._ficheEcran(c.hote, c.p); b=e.base; a=e.amp; }
      else if(c.type==='brouillon'){ var e2=window._ppEcran(); if(!e2 || e2.garde) return null; b=e2.base; a=e2.amp; }
      else if(c.type==='cercle'){ if(window._nueeDefileEtat){ b=58; a=16; } else { var s=window._nueeSemis; if(!s) return null; b=s.base; a=s.amp; } }
      if(b==null || a==null) return null; return {y:O.onde(b,a), chemin:O.chemin}; }catch(_){ return null; } }
  function bande(c){ if(!c || !c.hote) return;
    var h=c.hote, cv=h.querySelector(':scope > canvas.dz-bande'), oe=h.querySelector(':scope > button.dz-oeil'), d=lit(c), on=ondeDe(c);
    var instant=!!window._instant;
    /* le bouton de masquage : seulement quand un dessin est posé (masqué ou non), jamais pendant l'instant ni sur la page + */
    if(pose_(d) && on && !instant && c.type!=='brouillon'){
      if(!oe){ oe=document.createElement('button'); oe.type='button'; oe.className='dz-oeil'; h.appendChild(oe);
        oe.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); var cc=cibleFiche(), dd=lit(cc); if(!pose_(dd)) return; dd.masque=!dd.masque; garde(cc); bande(cc); try{ if(window._entier && window._entier.annonce) window._entier.annonce(); }catch(_){ } }); }
      var sc=(h.clientWidth||W)/W, yo=on.y(P.OEIL.x+17)-P.OEIL.ecart, m=!!d.masque;
      var etat=(m?'1':'0')+'|'+Math.round(yo*10)+'|'+(clair()?'c':'s');
      if(oe.getAttribute('data-etat')!==etat){ oe.setAttribute('data-etat', etat);
        oe.innerHTML = m ? ICO_OEIL_NON : ICO_OEIL; oe.setAttribute('aria-label', m ? 'Afficher le dessin' : 'Masquer le dessin'); oe.setAttribute('aria-pressed', m?'true':'false');
        oe.style.setProperty('left', (P.OEIL.x*sc)+'px', 'important'); oe.style.setProperty('top', (yo*sc)+'px', 'important');
        var fd = m ? NAT[natureDe(c)] : d.fond, en = lumi(fd)>128 ? ENCRE : CREME;
        oe.style.setProperty('--dz-oeil-fond', fd); oe.style.setProperty('--dz-oeil-encre', en); }
      if(oe.style.display==='none') oe.style.removeProperty('display');
    } else if(oe){ oe.remove(); }
    if(!(visible(c) && on) || instant){ if(cv) cv.remove(); return; }
    var sc2=(h.clientWidth||W)/W, dpr=Math.max(2, Math.min(3, window.devicePixelRatio||2));
    var bas=0; for(var x=0;x<=W;x+=6){ var yy=on.y(x); if(yy>bas) bas=yy; } bas=Math.ceil(Math.min(bas, d.h||surfH()));
    var sig=signature(d)+'|'+Math.round(on.y(0)*10)+','+Math.round(on.y(130)*10)+','+Math.round(on.y(260)*10)+','+Math.round(on.y(390)*10)+'|'+sc2+'|'+dpr;
    if(!cv){ cv=document.createElement('canvas'); cv.className='dz-bande'; cv.setAttribute('aria-hidden','true');
      var ref=h.querySelector(':scope > canvas'); if(ref && ref.nextSibling) h.insertBefore(cv, ref.nextSibling); else h.appendChild(cv); }
    if(cv.getAttribute('data-sig')===sig) return;                                    /* on compare avant de repeindre (§8) */
    cv.setAttribute('data-sig', sig);
    cv.width=Math.round(W*dpr); cv.height=Math.round(bas*dpr);
    cv.style.setProperty('width', (W*sc2)+'px', 'important'); cv.style.setProperty('height', (bas*sc2)+'px', 'important');
    var g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    var R=P.BANDE_RETRAIT, y2=function(x){ return on.y(x)-R; };
    g.beginPath(); on.chemin(g, y2, 0, W); g.lineTo(W,0); g.lineTo(0,0); g.closePath(); g.clip();
    g.setTransform(1,0,0,1,0,0); g.drawImage(entier(d, dpr), 0, 0);                    /* 1:1, calé en haut : la fiche en montre le haut */
  }
  var prevu=false;
  function bandes(){ if(prevu) return; prevu=true; requestAnimationFrame(function(){ prevu=false; try{ bande(cibleFiche()); bande(ciblePlus()); nettoie(); boutonCercle(); }catch(_){ } }); }
  function nettoie(){ ['detailPoster','createSheet'].forEach(function(id){ var h=$(id); if(!h || h.classList.contains('show')) return; [].forEach.call(h.querySelectorAll(':scope > .dz-bande, :scope > .dz-oeil'), function(e){ e.remove(); }); }); }
