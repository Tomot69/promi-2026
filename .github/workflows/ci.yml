# L'intégration continue de la vraie app (promi/). À chaque commit : la construction, le typage strict, le lint, le format, les fichiers
# générés (jetons, polices, pièces reprises, StoreKit) contre leur source, les tests unitaires, puis les tests de rendu en WebKit (le
# moteur de l'iPhone) — la vraie app contre le prototype, au pixel. Pas de fusion si un test est rouge.
name: vraie app
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verifier:
    runs-on: ubuntu-24.04   # pas ubuntu-latest : 26.04 depuis nov. 2026, où Playwright 1.60 n'installe pas WebKit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            promi
            outils
            app.html
            promi-moteur.js
            variantes
            PROMI-TOKENS.json
            Promi+Design.swift
            banc-etats
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: promi/package-lock.json }
      - run: npm ci
        working-directory: promi
      - name: fichiers générés, typage, lint, format, tests unitaires
        run: npm run verifier
        working-directory: promi
      - name: construction
        run: npm run construire
        working-directory: promi
  rendu:
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3, 4, 5, 6, 7, 8] }   # C-326 : les juges devenus tests ; 3a : six parts — à quatre, la deuxième (la page +) dépassait ses 60 min ; 3b : huit — la quatrième (l'identité de la page + et les juges lourds du socle) touchait 58 à 60 min, coupée
    runs-on: ubuntu-24.04   # pas ubuntu-latest : 26.04 depuis nov. 2026, où Playwright 1.60 n'installe pas WebKit
    timeout-minutes: 60   # l'installation de WebKit et de ses dépendances a pris 21 min (20 nov.) : 30 coupait les tests
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            promi
            app.html
            promi-moteur.js
            variantes
            banc-etats
            banc-rendu/ref/manifeste.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: promi/package-lock.json }
      - run: npm ci
        working-directory: promi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ hashFiles('promi/package-lock.json') }}
      - run: npx playwright install --with-deps webkit
        working-directory: promi
      - name: un état embarqué (celui du banc, jamais celui de Tom) — le test du démarrage l'exige
        run: node outils/embarquer-etat.ts ../banc-etats/etat-25.json
        working-directory: promi
      - run: npm run construire
        working-directory: promi
      - name: tests de rendu (WebKit) — la vraie app contre le prototype
        run: npx playwright test --shard=${{ matrix.part }}/8 --grep-invert "banc_rendu porté"
        working-directory: promi
        env: { CI: '1' }
      - if: failure() || cancelled()   # coupée par sa limite de temps aussi : ses images disent la cause
        uses: actions/upload-artifact@v4
        with: { name: 'resultats-rendu-${{ matrix.part }}', path: 'promi/tests/rendu/resultats/', if-no-files-found: ignore }
  banc:
    # le banc de rendu au pixel (figé et contre le prototype vivant) : seul, il prend 7 à 15 min ; dans une part il dépassait 30 min
    runs-on: ubuntu-24.04   # pas ubuntu-latest : 26.04 depuis nov. 2026, où Playwright 1.60 n'installe pas WebKit
    timeout-minutes: 60   # l'installation de WebKit et de ses dépendances a pris 21 min (20 nov.) : 30 coupait les tests
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            promi
            app.html
            promi-moteur.js
            variantes
            banc-etats
            banc-rendu/ref/manifeste.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: promi/package-lock.json }
      - run: npm ci
        working-directory: promi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ hashFiles('promi/package-lock.json') }}
      - run: npx playwright install --with-deps webkit
        working-directory: promi
      - name: un état embarqué (celui du banc, jamais celui de Tom) — le test du démarrage l'exige
        run: node outils/embarquer-etat.ts ../banc-etats/etat-25.json
        working-directory: promi
      - run: npm run construire
        working-directory: promi
      - name: le banc de rendu (WebKit) — la vraie app contre le prototype, au pixel
        run: npx playwright test tests/rendu/banc-rendu.spec.ts --workers=1
        working-directory: promi
        env: { CI: '1' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: resultats-banc, path: 'promi/tests/rendu/resultats/', if-no-files-found: ignore }
  sondes:
    # C-326 (Tom) : chaque test rougit sur une sonde — rejoue chaque test avec le défaut qu'il doit prendre, exige qu'il rougisse
    strategy:
      fail-fast: false
      matrix: { part: [1, 2, 3, 4, 5, 6] }   # 2b : six parts — à quatre, la première dépassait ses 60 min
    runs-on: ubuntu-24.04   # pas ubuntu-latest : 26.04 depuis nov. 2026, où Playwright 1.60 n'installe pas WebKit
    timeout-minutes: 60   # l'installation de WebKit et de ses dépendances a pris 21 min (20 nov.) : 30 coupait les tests
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            promi
            app.html
            promi-moteur.js
            variantes
            banc-etats
            banc-rendu/ref/manifeste.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: promi/package-lock.json }
      - run: npm ci
        working-directory: promi
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ hashFiles('promi/package-lock.json') }}
      - run: npx playwright install --with-deps webkit
        working-directory: promi
      - name: un état embarqué (celui du banc, jamais celui de Tom) — le test du démarrage l'exige
        run: node outils/embarquer-etat.ts ../banc-etats/etat-25.json
        working-directory: promi
      - run: npm run construire
        working-directory: promi
      - name: les sondes — chaque test rougit sur le défaut qu'il doit prendre
        run: npm run sondes -- --part=${{ matrix.part }}/6
        working-directory: promi
        env: { CI: '1' }
