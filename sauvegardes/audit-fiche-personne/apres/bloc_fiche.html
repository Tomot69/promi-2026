<style id="lot-FICHE-PERSONNE-CSS">
/* ════════════════════════════════════════════════════════════════════════════════════════════
   ⚑ LOT FICHE-PERSONNE — 11 septembre 2026. La fiche d'une personne, refaite sur la planche validée par Tom
   (PLANCHE-FICHE-PERSONNE-4.html ; audit AUDIT-FICHE-PERSONNE.md ; Q184, Q193). Bloc neuf, en fin de fichier :
   aucune règle existante touchée, rien du moteur de la Toile.
   CE QUI RESTE (Tom) : le nom, le visage, l'anneau sans chiffre (§2.9, la forme de toute la liste), « Tenu
   ensemble » (les paroles tenues, en dalles), « Ce que vous partagez » (Promi, Chiche, Promi de Nuée — en VRAIES
   cartes d'Index : la dalle, le champ de sa nature, le trait qui dit l'état), « + Planter un Promi » et
   « + Lancer un Chiche ». TOUT LE RESTE SORT, sans remplacement.
   ════════════════════════════════════════════════════════════════════════════════════════════ */
/* l'ombre de dalle animée (le « ghost-ink » de .tuto-fond::before) ne passe plus derrière la fiche — §4 règle 6 */
.frame #personSheet::before,#device #personSheet::before{display:none!important;content:none!important}
/* L'ANCIENNE FICHE — masquée NŒUD PAR NŒUD. Les nœuds restent dans le DOM (d'autres codes les adressent par id),
   et la nouvelle `openPerson` ne les remplit plus : le mot d'harmonie, le compte, la courbe, le second anneau,
   l'équilibre et sa phrase ne sont plus jamais écrits. */
.frame #personSheet .ps-head,.frame #personSheet #psMirror,.frame #personSheet>.grouplab,
.frame #personSheet #psList,.frame #personSheet .grip,
#device #personSheet .ps-head,#device #personSheet #psMirror,#device #personSheet>.grouplab,
#device #personSheet #psList,#device #personSheet .grip{display:none!important}
/* LE CADRE — 390 × 844, posé sur #device (la fiche fait 422 et commence 16 px avant : piège du §8) */
.frame #personSheet #psCadre,#device #personSheet #psCadre{position:absolute!important;width:390px!important;height:844px!important;
  margin:0!important;padding:0!important;max-width:none!important;z-index:3!important;pointer-events:none;color:#F4EEE1}
.frame.light #personSheet #psCadre,#device.light #personSheet #psCadre{color:#16171B}
#psCadre,#psCadre *{-webkit-text-fill-color:currentColor;box-sizing:border-box}
/* la colonne défile SOUS le plateau, comme l'Aura : elle commence au bord de l'écran et rogne à 100 */
#psCadre .ps-col{position:absolute!important;left:0;top:0;width:390px;height:844px;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;clip-path:inset(100px 0 0 0);pointer-events:auto;scrollbar-width:none;margin:0;padding:0}
#psCadre .ps-col::-webkit-scrollbar{display:none}
#psCadre .ps-pile{position:relative!important;left:0;top:0;width:390px;margin:0;padding:0}
#psCadre .ps-pile>*{position:absolute!important;margin:0}
/* le Noyau du §2.9 — 58, arc 6, l'image au centre à 36 */
#psCadre .ps-ny{width:58px;height:58px}
#psCadre .ps-ny svg{position:absolute;left:0;top:0;display:block}
#psCadre .ps-vis{position:absolute!important;left:11px;top:11px;width:36px;height:36px;border-radius:50%;background-size:cover}
/* les libellés — Bricolage 600, comme le sens d'une carte d'Index (Tom ; chantier 61 pour le §6) */
#psCadre .ps-lg{display:flex;gap:14px;align-items:center;color:#A8A396}
#psCadre .ps-lg span{display:flex;align-items:center;gap:6px;font-family:Bricolage,system-ui,sans-serif;font-weight:600;
  font-size:13px;letter-spacing:-.005em;white-space:nowrap}
#psCadre .ps-lg i{display:block;width:8px;height:8px;border-radius:50%}
#psCadre .ps-h{font-family:Bricolage,system-ui,sans-serif;font-weight:600;font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;white-space:nowrap;color:#A8A396}
#psCadre .ps-c{width:105px;height:89px}
#psCadre .ps-c .ps-bx{position:absolute;left:0;top:0;width:105px;height:56px;display:flex;align-items:center;justify-content:center}
#psCadre .ps-c canvas{display:block!important;max-width:88px!important;max-height:56px!important;width:auto!important;height:auto!important;
  opacity:1!important;filter:none!important}
#psCadre .ps-c span{position:absolute;left:0;top:64px;width:105px;font-family:Bricolage,system-ui,sans-serif;font-weight:600;
  font-size:13px;letter-spacing:-.01em;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#C9C4B4}
#psCadre .ps-cartes{left:0;width:390px}
/* les deux gestes — 167 × 62, trait 2, rayon 31 (la paire Inviter/Partager, §5) */
#psCadre .ps-bt{width:167px;height:62px;border-radius:31px;border:2px solid currentColor;display:flex;align-items:center;
  justify-content:center;font-family:Bricolage,system-ui,sans-serif;font-weight:700;font-size:15.5px;letter-spacing:-.01em;
  white-space:nowrap;cursor:pointer;background:transparent}
.frame.light #psCadre .ps-lg,#device.light #psCadre .ps-lg,.frame.light #psCadre .ps-h,#device.light #psCadre .ps-h{color:#6B6658}
.frame.light #psCadre .ps-c span,#device.light #psCadre .ps-c span{color:#4A463C}
/* le nom du plateau — Bricolage 700 comme tous les titres ; `#personSheet h2{800!important}` (atelier-da) le mettait
   dans une graisse que l'app n'embarque pas (§6). Une règle plus précise, pas un style en ligne (une autre passe l'efface). */
.frame #personSheet .enh h2#psName,#device #personSheet .enh h2#psName{font-weight:700!important}
/* LA CARTE D'INDEX, HORS DE #device. Son CSS est posé sur `#device .s4-carte` (lot-S4, l. 18502-18522) ; la fiche d'une
   personne vit sous `.frame`, hors de `#device` : sans ceci, les cartes s'empilaient en colonne à x = 0. MÊMES VALEURS,
   rattachées à #psCadre — si la carte change là-bas, elle change ici (dit dans ETAT-DES-LIEUX). L'état s'écrit en
   ApfelMid 500 : la table de report du §6 (Apfel 500 → ApfelMid 500), ce que l'Index affiche (mesuré). */
#psCadre .s4-grille{position:relative!important;width:390px!important;margin:0!important;padding:0!important}
#psCadre .s4-carte{position:absolute;overflow:hidden;box-sizing:border-box;margin:0;padding:0;border:0;box-shadow:none;cursor:pointer;opacity:1;filter:none}
#psCadre .s4-carte>canvas{position:absolute;left:0;top:0;display:block;opacity:1!important;filter:none!important;mix-blend-mode:normal!important;z-index:1}
#psCadre .s4-carte>.s4-eb,#psCadre .s4-carte>.s4-ti,#psCadre .s4-carte>.s4-et{position:absolute;z-index:2;margin:0;padding:0}
#psCadre .s4-carte>.s4-eb{font-family:Bricolage,system-ui,sans-serif;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#psCadre .s4-carte>.s4-ti{font-family:Bricolage,system-ui,sans-serif;font-weight:700;letter-spacing:-.025em;overflow:hidden}
#psCadre .s4-carte>.s4-et{font-family:ApfelMid,system-ui,sans-serif;font-weight:500;letter-spacing:.18em;line-height:1;white-space:nowrap;overflow:hidden}
</style>
<script id="lot-FICHE-PERSONNE">
/* ⚑ LOT FICHE-PERSONNE — voir le commentaire du style. `openPerson` est redéfinie ici ; elle garde le correctif
   `avec` (lot-PERSONNE-AVEC) et ne remplit plus rien de l'ancienne fiche. */
(function(){ try{
  var MENTHE='#2BE88C', PERI='#8FA0FF', TERRA='#F07A2E';
  function $i(id){ return document.getElementById(id); }
  function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }
  function clair(){ var d=$i('device'), f=document.querySelector('.frame');
    return !!((d&&d.classList.contains('light'))||(f&&f.classList.contains('light'))); }
  /* les paroles partagées : où la personne est « à qui », « de qui » OU « avec » (le compagnon d'un Chiche) */
  function paroles(nom){ try{ return promises.filter(function(p){ return p && !p.draft && (p.who===nom||p.from===nom||p.avec===nom); }); }catch(e){ return []; } }
  function parts(L){ var n=L.length, t=0, e=0, r=0;
    L.forEach(function(p){ if(p.status==='tenu') t++; else if(p.status==='encours') e++; else r++; });
    return n ? [t/n, e/n, r/n] : [0,0,0]; }
  /* ── LE NOYAU (§2.9) — piste neutre, arcs d'état à bout franc, l'image de la personne au centre ── */
  function noyau(nom, pp){
    var w=el('div','ps-ny'), d=58, lw=6, r=(d-lw)/2, C=2*Math.PI*r, nb=pp.filter(function(v){return v>0;}).length;
    var s='<svg viewBox="0 0 58 58" width="58" height="58"><circle cx="29" cy="29" r="'+r+'" fill="none" stroke="'+(clair()?'#DED7C6':'#2A2C34')+'" stroke-width="'+lw+'"/>';
    var a=0, cols=[MENTHE,PERI,TERRA];
    pp.forEach(function(f,i){ if(f<=0) return; var l=f*C-(nb>1?2:0);
      s+='<circle class="ps-arc" data-part="'+i+'" cx="29" cy="29" r="'+r+'" fill="none" stroke="'+cols[i]+'" stroke-width="'+lw+'" stroke-dasharray="'+l.toFixed(2)+' '+(C-l).toFixed(2)+'" stroke-dashoffset="'+(-a).toFixed(2)+'" transform="rotate(-90 29 29)"/>';
      a+=f*C; });
    w.innerHTML=s+'</svg>';
    var v=el('div','ps-vis'), moi=(typeof _isMe==='function')&&_isMe(nom);
    if(moi && typeof USER!=='undefined' && USER && USER.photo) v.style.background='center/cover url("'+USER.photo+'")';
    else { try{ v.style.background=_blobBg(moi?('u'+USER.seed):nom); }catch(e){} }
    w.appendChild(v); return w;
  }
  function legende(){ var g=el('div','ps-lg');
    [['tenues',MENTHE],['en cours',PERI],['à tenir',TERRA]].forEach(function(q){ var s=el('span'), i=el('i'); i.style.background=q[1];
      s.appendChild(i); s.appendChild(document.createTextNode(q[0])); g.appendChild(s); }); return g; }
  /* ── LES VRAIES CARTES DE L'INDEX — le moteur du lot S4 (`_s4Index`) est prêté le temps d'un appel : il bâtit
     dans `#indexList` ; on lui prête ce nom pour la boîte de la fiche, puis on rend TOUT à l'identique (l'id, les
     entrées, le cache). Aucune variante locale de la carte (§5). ── */
  var MOTS_ETAT=/^(TENUE?S?|TENU À DEUX|À TENIR|EN COURS|LANCÉ|RELEVÉ|À RELEVER|GARDÉ DE CÔTÉ|DEMANDÉ|EN ATTENTE)$/i;
  function cartes(box, L){
    if(!L.length || typeof window._s4Index!=='function') return 0;
    var vraie=$i('indexList'), sE=window._s4Entrees, sF=window._s4Frais, sV=window._s4Vide;
    try{
      if(vraie) vraie.id='indexList-prete'; box.id='indexList';
      window._s4Entrees=L.map(function(p){ return {id:p.id}; }); window._s4Frais=false;
      window._s4Index();
    }finally{
      box.id='psCartes'; if(vraie) vraie.id='indexList';
      window._s4Entrees=sE; window._s4Frais=sF; window._s4Vide=sV;
    }
    /* la ligne du bas : L'ÉTAT N'EST PLUS ÉCRIT — le trait le dit (Tom) ; on garde le temps quand l'app le sait,
       et la Nuée de la parole (l'Index, qui range ces paroles sous leur Nuée, n'a jamais eu à l'écrire) */
    var cs=[].slice.call(box.querySelectorAll('.s4-carte')), bas=0;
    cs.forEach(function(c,i){ var p=L[i], et=c.querySelector('.s4-et'); if(!p) return;
      c.setAttribute('data-pid', p.id);
      if(et){ var seg=(et.textContent||'').split(' · ').map(function(s){return s.trim();}).filter(function(s){ return s && !MOTS_ETAT.test(s); });
        if(p.nuee){ var nn=(typeof NUE!=='undefined' && NUE[p.nuee]) || p.nuee; seg.push(String(nn).toUpperCase()); }
        et.textContent=seg.join(' · '); }
      bas=Math.max(bas, c.offsetTop+c.offsetHeight); });
    return bas;
  }
  /* ── LES DEUX GESTES — la page +, la personne DÉJÀ choisie (le modèle : openCreateForNuee) ── */
  function planter(nom, chiche){
    try{
      var cs=$i('createSheet'); if(!cs) return;
      try{ selNuee=null; }catch(_){}
      window.createKind = chiche ? 'chiche' : 'promi';
      var pf=$i('promiForm'), nf=$i('nueeForm'), df=$i('draftForm');
      if(pf) pf.style.display='block'; if(nf) nf.style.display='none'; if(df) df.style.display='none';
      openSheet(cs);
      try{ if(window._csBuildFlex) window._csBuildFlex(); }catch(_){}
      cs.setAttribute('data-kind', window.createKind); cs.classList.remove('cs-nuee');
      [].forEach.call(cs.querySelectorAll('.tile'), function(x){ x.classList.toggle('on', x.dataset.kind===window.createKind); });
      var qui=function(){
        window._csSens = chiche ? 'chiche' : 'faire';
        if(window._phrase){ window._phrase.sens = chiche ? 'chiche' : 'faire'; window._phrase.faireAutre=false; window._phrase.qui=nom; }
        window.newWhoSel=[nom]; var fw=$i('fWho'); if(fw) fw.value=nom;
      };
      qui();
      try{ if(typeof buildCreateNuees==='function') buildCreateNuees(); if(typeof buildWhoChips==='function') buildWhoChips(); }catch(_){}
      try{ if(window._phraseRendu) window._phraseRendu(); if(window.renderCsDalle){ window.renderCsDalle(); setTimeout(window.renderCsDalle,240); }
           if(window._csColorLabels) window._csColorLabels(); }catch(_){}
      setTimeout(function(){ try{ if(window._csVersPhrase) window._csVersPhrase(); qui(); if(window._phraseRendu) window._phraseRendu(); }catch(_){} }, 140);
    }catch(e){}
  }
  /* ── LA FICHE ── */
  function rangeFiche(){ var c=$i('psCadre'); if(c && c.parentNode) c.parentNode.removeChild(c); }
  (window._rangeurs = window._rangeurs || []).push(rangeFiche);
  /* le cadre se pose sur #device, dans le repère de la fiche, transformation d'ouverture retirée */
  function poser(sh, cad){
    var dv=$i('device'); if(!dv||!sh||!cad) return;
    var rd=dv.getBoundingClientRect(), rs=sh.getBoundingClientRect(), s=rd.width/390||1, tx=0, ty=0;
    try{ var m=new DOMMatrix(getComputedStyle(sh).transform); tx=m.m41; ty=m.m42; }catch(_){}
    cad.style.setProperty('left', ((rd.left-rs.left)/s + tx + sh.scrollLeft)+'px', 'important');
    cad.style.setProperty('top',  ((rd.top -rs.top )/s + ty + sh.scrollTop )+'px', 'important');
  }
  window.openPerson = function openPerson(nom){
    if(!nom) return;
    var sh=$i('personSheet'); if(!sh) return;
    var nm=$i('psName'); if(nm){ nm.textContent=nom; nm.style.setProperty('font-weight','700','important'); }
    openSheet(sh);                       /* closeAll passe ici, et son rangeur retire le cadre d'avant */
    try{ sh.scrollTop=0; }catch(_){}
    var L=paroles(nom), T=L.filter(function(p){ return p.status==='tenu'; });
    var cad=el('div'); cad.id='psCadre'; cad.setAttribute('data-fiche', nom);
    var col=el('div','ps-col'); col.setAttribute('data-defile','1');
    var pile=el('div','ps-pile'); col.appendChild(pile); cad.appendChild(col); sh.appendChild(cad);
    var pp=parts(L), n=noyau(nom, pp); n.style.left='24px'; n.style.top='124px'; pile.appendChild(n);
    if(L.length){ var g=legende(); g.style.left='100px'; g.style.top='145px'; pile.appendChild(g); }
    var y=124+58+32;
    if(T.length){
      var h=el('div','ps-h','Tenu ensemble'); h.style.left='24px'; h.style.top=y+'px'; pile.appendChild(h); y+=30;
      T.forEach(function(p,i){ var c=el('div','ps-c'); c.style.left=(24+(i%3)*117)+'px'; c.style.top=(y+Math.floor(i/3)*101)+'px';
        c.setAttribute('data-pid', p.id);
        var bx=el('div','ps-bx'), cv=document.createElement('canvas');
        try{ window.Toile && Toile.dalleTrame(cv, p.id, 1, p.monde); }catch(_){}      /* dans le monde de SA plantation */
        bx.appendChild(cv); c.appendChild(bx); c.appendChild(el('span',null,p.title||'')); pile.appendChild(c); });
      y+=Math.ceil(T.length/3)*101-12+32;
    }
    if(L.length){
      var h2=el('div','ps-h','Ce que vous partagez'); h2.style.left='24px'; h2.style.top=y+'px'; pile.appendChild(h2); y+=30;
      var box=el('div','ps-cartes'); box.id='psCartes'; box.style.top=y+'px'; pile.appendChild(box);
      var b=cartes(box, L); box.style.height=b+'px'; y+=b;
    }
    var bt=Math.max(760, y+28); if(bt+62>822 && bt<844) bt=844;     /* entiers à l'ouverture, ou franchement sous le pli */
    [['+ Planter un Promi',false,24],['+ Lancer un Chiche',true,199]].forEach(function(q){
      var e=el('div','ps-bt',q[0]); e.setAttribute('role','button'); e.setAttribute('data-geste', q[1]?'chiche':'promi');
      e.style.left=q[2]+'px'; e.style.top=bt+'px';
      e.onclick=function(){ planter(nom, q[1]); }; pile.appendChild(e); });
    pile.style.height=(bt+62+22)+'px';
    poser(sh, cad);
    var k=0; (function repose(){ poser(sh, cad); if(++k<40) requestAnimationFrame(repose); })();
    /* LA COMPOSITION EST PUBLIÉE (§7 : on compare la composition, pas la peinture) */
    window._ficheComp={nom:nom, ids:L.map(function(p){return p.id;}), tenues:T.map(function(p){return p.id;}), parts:pp};
  };
}catch(e){} })();
</script>
