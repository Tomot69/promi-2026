<script data-dc-script data-props='{"theme":{"editor":"enum","options":["sombre","clair"],"default":"sombre","section":"Vue"}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { choisi: 0 }; }
  renderVals(){
    var sombre = (this.props.theme ?? 'sombre') === 'sombre';
    /* §1.3 — les deux corps ; §2.1 bis — la teinte claire vaut dans les deux themes */
    var corps = sombre ? '#12142A' : '#F4EEE1';
    var encre = sombre ? '#F4EEE1' : '#16171B';
    var sec   = sombre ? '#CBAAFF' : '#3A54FF';
    var NOMS  = ["Plein"];
    var LIB   = 4;
    var v = { corps: corps, encre: encre, sec: sec,
              nom: NOMS[this.state.choisi],
              prix: this.state.choisi < LIB ? '' : ' \u2014 0,50 \u20AC' };
    for (var i = 0; i < NOMS.length; i++) {
      var on = (i === this.state.choisi);
      /* selectionne : le champ porte la nature, l'echantillon prend la teinte claire */
      v['bg' + i] = on ? '#3A54FF' : 'transparent';
      v['bd' + i] = on ? '#3A54FF' : encre;
      v['fg' + i] = on ? '#CBAAFF' : encre;
      /* ce qui n'est pas a toi n'a pas de matiere — sauf le temps de l'essayer (Q128) */
      v['op' + i] = (i < LIB || on) ? '1' : '0';
      v['pick' + i] = (function (k, self) { return function () { self.setState({ choisi: k }); }; })(i, this);
    }
    return v;
  }
}
</script>
