<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic GPU</title>
<style>
:root{--fond:#F7F0DE;--encre:#201908}
@media (prefers-color-scheme:dark){:root{--fond:#100D0B;--encre:#F7F0DE}}
body{margin:0;padding:24px 16px;background:var(--fond);color:var(--encre);font:16px/1.5 system-ui,sans-serif}
h1{font-size:22px;margin:0 0 12px}
td{padding:4px 12px 4px 0;vertical-align:top}
b{font-variant-numeric:tabular-nums}
</style></head><body>
<h1>Diagnostic GPU (Madrure)</h1>
<p>Ce que le processeur graphique de cet appareil accepte. Madrure a besoin de 206 vecteurs d'uniformes par fragment pour 64 nœuds.</p>
<table id="t"></table>
<script>
var t=document.getElementById('t');
function ligne(k,v){var r=t.insertRow();r.insertCell().textContent=k;var c=r.insertCell();c.innerHTML='<b>'+v+'</b>';}
try{
  var cv=document.createElement('canvas');
  var gl=cv.getContext('webgl',{failIfMajorPerformanceCaveat:true});
  ligne('WebGL (sans chemin de secours)', gl?'oui':'non');
  if(!gl){gl=cv.getContext('webgl');ligne('WebGL (avec secours)', gl?'oui':'non');}
  if(gl){
    ligne('MAX_FRAGMENT_UNIFORM_VECTORS', gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS));
    ligne('MAX_VERTEX_UNIFORM_VECTORS', gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS));
    ligne('MAX_TEXTURE_SIZE', gl.getParameter(gl.MAX_TEXTURE_SIZE));
    ligne('OES_texture_float', gl.getExtension('OES_texture_float')?'oui':'non');
    var d=gl.getExtension('WEBGL_debug_renderer_info');
    ligne('GPU', d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER));
  }
}catch(e){ligne('erreur',String(e));}
ligne('Navigateur', navigator.userAgent);
</script>
</body></html>
